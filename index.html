{q:"Which is a common advantage of cloud computing?",opts:["No security responsibility exists","Scalability and flexible resource usage","All risks disappear","No internet connection is ever needed"],a:1,e:"Cloud environments can scale resources up or down based on demand."},

{q:"Which is a common advantage of on-premise infrastructure?",opts:["More direct control over physical hardware and local systems","No need for maintenance","No need for security controls","Automatic global scaling"],a:0,e:"On-premise environments often give the organization more direct control over hardware, location, and configuration."},

{q:"Which objective mainly covers Identity and Access Management solutions?",opts:["Objective 4.6","Objective 1.1","Objective 3.1","Objective 5.5"],a:0,e:"Objective 4.6 focuses on identity and access management solutions."},

{q:"Which objective is connected to password attacks?",opts:["Objective 2.4","Objective 5.1","Objective 3.3","Objective 1.3"],a:0,e:"Objective 2.4 covers indicators of malicious activity, including password attack behavior."},

{q:"What does authentication verify?",opts:["What a user is allowed to access","Who the user claims to be","How much storage a user has","Whether a system is patched"],a:1,e:"Authentication verifies identity, such as confirming that a user is really who they claim to be."},

{q:"What does authorization determine?",opts:["Who the user claims to be","What the authenticated user is allowed to access","Whether a password is long enough","Whether a system has malware"],a:1,e:"Authorization happens after authentication and determines permissions or access rights."},

{q:"What does accounting track?",opts:["User actions and resource usage","Only failed password changes","Only firewall rules","Only hardware inventory"],a:0,e:"Accounting records user activity, access, and resource usage for auditing and accountability."},

{q:"Which term best matches verifying identity with a password?",opts:["Authentication","Authorization","Accounting","Attestation"],a:0,e:"A password is used to authenticate the user’s identity."},

{q:"Which term best matches allowing a user to read payroll but not edit it?",opts:["Authentication","Authorization","Federation","Password spraying"],a:1,e:"Authorization controls what actions a user can perform after identity is verified."},

{q:"Which term best matches recording that a user accessed a file at 10:03 PM?",opts:["Accounting","Authentication","Passwordless login","Federation"],a:0,e:"Accounting creates records of user actions for audits and investigations."},

{q:"What is multifactor authentication?",opts:["Using two passwords from the same category","Using two or more different authentication factor types","Using only biometrics","Using only a username"],a:1,e:"Multifactor authentication requires more than one category of proof, such as something you know and something you have."},

{q:"Which pair is true multifactor authentication?",opts:["Password and personal identification number","Password and security question","Password and phone authenticator app","Two different passwords"],a:2,e:"A password is something you know, and a phone authenticator app is something you have."},

{q:"Why are password plus security question not strong multifactor authentication?",opts:["Both are usually something you know","Both are something you have","Both are biometric","Both are location-based"],a:0,e:"A password and a security question are both knowledge factors, so they are not different factor types."},

{q:"Which is an example of something you know?",opts:["Password","Smart card","Fingerprint","Office location"],a:0,e:"Something you know is a knowledge factor, such as a password or personal identification number."},

{q:"Which is an example of something you have?",opts:["Password","Security question","Hardware token","Typing pattern"],a:2,e:"Something you have is a possession factor, such as a smart card, phone, or hardware token."},

{q:"Which is an example of something you are?",opts:["Fingerprint","Password","One-time code","Badge"],a:0,e:"Something you are is an inherence factor, such as fingerprint or facial recognition."},

{q:"Which is an example of somewhere you are?",opts:["Geographic location","Password phrase","Smart card","Hardware token"],a:0,e:"Somewhere you are uses location as part of the authentication decision."},

{q:"Which is an example of something you do?",opts:["Typing rhythm","Password","Security badge","Recovery email"],a:0,e:"Something you do can include behavioral patterns, such as typing rhythm or gestures."},

{q:"What is a one-time password?",opts:["A reusable password for all services","A temporary code used for one login session or transaction","A password that never expires","A default vendor password"],a:1,e:"A one-time password is temporary and designed for single use."},

{q:"Why are one-time passwords useful?",opts:["They reduce the value of a stolen code after use","They remove the need for identity proof","They are always public","They never expire"],a:0,e:"A one-time password is less useful to attackers after it has been used or expired."},

{q:"What is a hardware token?",opts:["A physical device that helps authenticate a user","A software patch","A written policy","A firewall rule"],a:0,e:"A hardware token is a possession factor used to prove the user has a trusted physical device."},

{q:"What is biometric authentication?",opts:["Authentication based on biological or behavioral traits","Authentication based only on passwords","Authentication based on shared administrator accounts","Authentication based only on network speed"],a:0,e:"Biometric authentication uses traits such as fingerprints, face, iris, or voice."},

{q:"What is a common weakness of biometric authentication?",opts:["You can easily change your fingerprint after a breach","Biometric data may be difficult or impossible to replace if compromised","It never has false readings","It cannot be used with multifactor authentication"],a:1,e:"Unlike passwords, biometric traits are hard to change if exposed or misused."},

{q:"What is password security mainly measuring?",opts:["How resistant a password is to guessing and cracking","How often users log in","How many apps are installed","How fast the network is"],a:0,e:"Password security evaluates how difficult it is for attackers to guess or crack the password."},

{q:"Which password characteristic usually improves security the most?",opts:["Length","Using the company name","Reusing the same password","Writing it on paper"],a:0,e:"Longer passwords increase the search space and are harder to brute force."},

{q:"What password length is generally stronger for modern policies?",opts:["4 to 6 characters","6 to 8 characters","12 to 16 characters or more","Exactly 8 characters forever"],a:2,e:"Longer passwords, commonly 12 to 16 characters or more, are much harder to crack."},

{q:"What is password complexity?",opts:["Using different character types such as uppercase, lowercase, numbers, and symbols","Using the same password everywhere","Using only dictionary words","Using the shortest password possible"],a:0,e:"Complexity increases the number of possible combinations an attacker must try."},

{q:"Why is password reuse dangerous?",opts:["One compromised password can expose multiple accounts","It makes passwords impossible to guess","It improves account isolation","It removes the need for multifactor authentication"],a:0,e:"If the same password is reused, one breach can lead to compromise of other accounts."},

{q:"What is a password manager?",opts:["A tool that securely stores and manages passwords","A tool that removes all authentication","A tool that guesses passwords","A tool that disables multifactor authentication"],a:0,e:"Password managers store passwords securely and help users create unique strong passwords."},

{q:"Which password manager feature helps prevent password reuse?",opts:["Password generation","Screen brightness control","Firewall logging","Port scanning"],a:0,e:"Password managers can generate unique strong passwords for each account."},

{q:"What is passwordless authentication?",opts:["Authentication that avoids traditional passwords using methods like biometrics, tokens, magic links, or passkeys","Authentication with no identity check","Authentication using the same password everywhere","Authentication based only on usernames"],a:0,e:"Passwordless authentication replaces traditional passwords with stronger or easier methods."},

{q:"What is a passkey?",opts:["A passwordless method that uses public key cryptography and device authentication","A default password written on a router","A shared password for a team","A password reset email only"],a:0,e:"Passkeys use public key cryptography and often rely on the user’s device lock or biometric check."},

{q:"Which passwordless method sends a one-time login link by email?",opts:["Magic link","Dictionary attack","Password spraying","Access control list"],a:0,e:"A magic link is a one-time link sent to a user, often through email, to authenticate them."},

{q:"What is a brute force password attack?",opts:["Trying every possible password combination","Trying one common password against many users","Using only public records","Stealing a physical badge"],a:0,e:"A brute force attack tries every possible combination until the correct password is found."},

{q:"What best mitigates brute force attacks?",opts:["Longer passwords, account lockout, multifactor authentication, and limiting login attempts","Short passwords","Default credentials","Password reuse"],a:0,e:"Brute force attacks become harder when passwords are long and attempts are limited."},

{q:"What is a dictionary attack?",opts:["Trying passwords from a list of common words or leaked passwords","Trying every possible character combination","Calling users by phone","Using a hardware token"],a:0,e:"A dictionary attack uses a prepared list of likely passwords."},

{q:"What type of password is most vulnerable to a dictionary attack?",opts:["A common word or simple variation","A long random unique password","A passkey","A hardware token"],a:0,e:"Common words and simple variations are likely to appear in password dictionaries."},

{q:"What is password spraying?",opts:["Trying many passwords against one account","Trying one or a few common passwords across many accounts","Trying only biometric factors","Encrypting passwords with a salt"],a:1,e:"Password spraying avoids quick lockout by trying common passwords across many users."},

{q:"Why can password spraying bypass simple lockout rules?",opts:["It uses many attempts against one user quickly","It spreads attempts across many accounts slowly","It only works offline","It never uses passwords"],a:1,e:"Password spraying may avoid triggering lockouts because each account receives only a small number of attempts."},

{q:"What is a hybrid password attack?",opts:["Combining dictionary words with variations such as numbers or symbols","Only using fingerprints","Only using physical access","Only using one-time passwords"],a:0,e:"A hybrid attack modifies dictionary words with likely variations, such as adding numbers or symbols."},

{q:"What is credential stuffing?",opts:["Using stolen username and password pairs from one breach to try other services","Trying every possible character combination","Changing passwords after a breach","Using one-time passwords only"],a:0,e:"Credential stuffing abuses reused credentials from previous breaches."},

{q:"Which user behavior makes credential stuffing more successful?",opts:["Using unique passwords per site","Reusing the same password across services","Using multifactor authentication","Using a password manager properly"],a:1,e:"Credential stuffing works best when users reuse the same password on multiple sites."},

{q:"What is a pass-the-hash attack?",opts:["Using a password hash to authenticate without knowing the plaintext password","Guessing passwords from a dictionary","Trying one password across many users","Sending a magic link"],a:0,e:"Pass-the-hash lets attackers use the captured hash itself to authenticate in some environments."},

{q:"Which control helps reduce the impact of pass-the-hash attacks?",opts:["Least privilege and patching","Password reuse","Shared administrator accounts","No multifactor authentication"],a:0,e:"Least privilege, patching, and multifactor authentication reduce the chance and impact of hash misuse."},

{q:"What is salting in password storage?",opts:["Adding random data before hashing a password","Encrypting a whole disk","Trying many passwords","Sharing the same password"],a:0,e:"A salt is random data added before hashing so identical passwords produce different hash values."},

{q:"Why does salting help protect passwords?",opts:["It makes rainbow table and precomputed attacks harder","It makes all passwords public","It removes hashing","It allows password reuse safely"],a:0,e:"Salting prevents attackers from easily using precomputed hash tables against many passwords."},

{q:"What is key stretching?",opts:["Making password hashing slower or stronger to resist cracking","Making passwords shorter","Removing complexity rules","Sharing keys with everyone"],a:0,e:"Key stretching increases the work required to crack passwords."},

{q:"What is Single Sign-On?",opts:["A system that lets users authenticate once and access multiple services","A system requiring different logins for every app","A password attack method","A hardware disposal process"],a:0,e:"Single Sign-On allows users to log in once and access multiple connected applications."},

{q:"What is a benefit of Single Sign-On?",opts:["Simplified user experience and fewer passwords to manage","More password reuse across unrelated sites","No need for access control","No need for account monitoring"],a:0,e:"Single Sign-On reduces login friction and can improve password management."},

{q:"What is a risk of Single Sign-On?",opts:["If the central identity account is compromised, many services may be affected","It prevents all account compromise","It removes identity management","It only works offline"],a:0,e:"Single Sign-On creates convenience, but the central identity becomes very important to protect."},

{q:"What is federation in identity management?",opts:["Trust between organizations or identity providers that allows users to access resources across domains","A brute force password attack","A local-only password file","A hardware destruction method"],a:0,e:"Federation allows trusted identity sharing between different systems or organizations."},

{q:"What is the difference between Single Sign-On and federation?",opts:["Single Sign-On focuses on one login across services; federation extends trusted identity across separate organizations or domains","They are exactly the same in all cases","Federation means no authentication","Single Sign-On only applies to physical doors"],a:0,e:"Single Sign-On is about one login experience, while federation is about trust relationships between identity providers and services."},

{q:"What does Security Assertion Markup Language do?",opts:["Exchanges authentication and authorization data between identity providers and service providers","Encrypts hard drives only","Destroys passwords","Scans open ports"],a:0,e:"Security Assertion Markup Language is commonly used for federated authentication and Single Sign-On."},

{q:"What is an identity provider?",opts:["The system that authenticates the user and provides identity information","The system that destroys old hardware","A password attack tool","A firewall deny list"],a:0,e:"An identity provider verifies the user and sends identity claims to services."},

{q:"What is a service provider in federated access?",opts:["The application or service that trusts the identity provider","The attacker guessing passwords","The user’s personal notebook","The password vault only"],a:0,e:"A service provider relies on the identity provider to authenticate users."},

{q:"What is Privileged Access Management?",opts:["Restricting and monitoring powerful administrative access","Giving every user administrator access","Removing all logs from privileged accounts","Sharing root passwords by email"],a:0,e:"Privileged Access Management controls, monitors, and limits privileged accounts."},

{q:"Why is Privileged Access Management important?",opts:["Privileged accounts can cause major damage if abused or compromised","Standard users have more power than administrators","It removes the need for passwords","It only applies to guest accounts"],a:0,e:"Privileged accounts have high permissions, so they need stronger control and monitoring."},

{q:"What are just-in-time permissions?",opts:["Administrative access granted only when needed and removed afterward","Permanent administrator access for everyone","A password that never expires","A public login link"],a:0,e:"Just-in-time permissions reduce risk by granting elevated access only for a specific task and time."},

{q:"What is password vaulting?",opts:["Securely storing and controlling access to privileged passwords","Writing passwords on sticky notes","Reusing one password everywhere","Disabling multifactor authentication"],a:0,e:"Password vaulting stores privileged credentials securely and tracks access."},

{q:"What is a temporal account?",opts:["A temporary account created for time-limited access","A permanent shared administrator account","A deleted audit log","A public guest account with no expiry"],a:0,e:"Temporal accounts are created for a limited purpose and disabled or deleted after a set time."},

{q:"What is the principle of least privilege?",opts:["Users receive only the access required to do their job","Users receive administrator access by default","Access is never reviewed","All users share one account"],a:0,e:"Least privilege limits users to the minimum necessary permissions."},

{q:"What is authorization creep?",opts:["Users slowly accumulate more permissions than needed over time","Passwords getting longer over time","A server becoming slower","A firewall blocking traffic"],a:0,e:"Authorization creep happens when users keep old permissions after roles change."},

{q:"How can authorization creep be reduced?",opts:["Regular access reviews","Sharing admin accounts","Removing multifactor authentication","Never reviewing permissions"],a:0,e:"Regular reviews help remove unnecessary permissions."},

{q:"What is Mandatory Access Control?",opts:["Access based on security labels controlled by the system, not the resource owner","Access decided only by the file owner","Access based only on job role","Access based only on time of day"],a:0,e:"Mandatory Access Control uses labels and central rules to control access."},

{q:"In Mandatory Access Control, when is access usually granted?",opts:["When the user’s clearance label meets or exceeds the resource label","Whenever the user owns any file","Whenever the password is short","Whenever the user asks politely"],a:0,e:"Mandatory Access Control compares subject clearance and object classification labels."},

{q:"What is Discretionary Access Control?",opts:["Resource owners decide who can access their resources","The system uses labels only","Access is based only on time","Access is based only on attributes"],a:0,e:"Discretionary Access Control lets owners control permissions for their objects."},

{q:"What is Role-Based Access Control?",opts:["Permissions are assigned to job roles, and users receive permissions through roles","Every user manually receives unrelated permissions","Access is based only on location","Only the file owner decides access"],a:0,e:"Role-Based Access Control maps permissions to roles such as administrator, manager, or analyst."},

{q:"Why is Role-Based Access Control useful in companies?",opts:["It simplifies permission management based on job functions","It removes all need for authentication","It gives every user full access","It prevents all password attacks"],a:0,e:"Role-Based Access Control makes access easier to manage when users join, leave, or change jobs."},

{q:"What is Rule-Based Access Control?",opts:["Access is based on specific rules or conditions","Access is based only on job title","Access is based only on file ownership","Access is always allowed"],a:0,e:"Rule-Based Access Control uses rules, such as time restrictions or network location."},

{q:"What is Attribute-Based Access Control?",opts:["Access decisions use user, resource, and environment attributes","Access is based only on ownership","Access is based only on one static role","Access is always denied"],a:0,e:"Attribute-Based Access Control uses multiple attributes, such as role, location, time, sensitivity, and threat level."},

{q:"Which access model is best described by 'only employees in finance can access payroll during business hours from company devices'?",opts:["Attribute-Based Access Control","Discretionary Access Control","Mandatory Access Control","No access control"],a:0,e:"This uses multiple attributes: department, time, device, and resource type."},

{q:"Which access model is best described by 'file owners decide who can read their files'?",opts:["Discretionary Access Control","Mandatory Access Control","Attribute-Based Access Control","Password spraying"],a:0,e:"Discretionary Access Control gives resource owners control over access."},

{q:"Which access model is best described by 'users with Secret clearance can access Secret documents'?",opts:["Mandatory Access Control","Discretionary Access Control","Passwordless authentication","Single Sign-On"],a:0,e:"Mandatory Access Control uses clearance and classification labels."},

{q:"Which access model is best described by 'help desk role can reset passwords'?",opts:["Role-Based Access Control","Mandatory Access Control","Discretionary Access Control","Credential stuffing"],a:0,e:"Role-Based Access Control grants permissions according to job roles."},

{q:"Which access model is best described by 'deny login after 6 PM unless the user is on the emergency team'?",opts:["Rule-Based or Attribute-Based Access Control","Discretionary Access Control only","Mandatory Access Control only","Password manager"],a:0,e:"The decision uses conditions such as time and group membership, so it fits rule-based or attribute-based control."},

{q:"What is time-of-day restriction?",opts:["Limiting access based on specific allowed hours","Using passwords that expire daily","Changing usernames every morning","Encrypting data at night"],a:0,e:"Time-of-day restrictions limit when users can access systems."},

{q:"Which account type should normally have the least access?",opts:["Standard user account","Domain administrator account","Root account","Local administrator account"],a:0,e:"Standard user accounts should have limited permissions for normal work."},

{q:"Which account type has high system privileges?",opts:["Administrator or root account","Guest account only","Disabled account","Read-only user"],a:0,e:"Administrator or root accounts have high privileges and must be strongly controlled."},

{q:"A user logs in once and then opens email, payroll, and ticketing without separate logins. What is being used?",opts:["Single Sign-On","Password spraying","Discretionary Access Control","Temporal account"],a:0,e:"Single Sign-On allows one authentication event to provide access to multiple services."},

{q:"A contractor receives admin access for two hours, then it is automatically removed. What is this?",opts:["Just-in-time permissions","Password reuse","Mandatory Access Control","Credential stuffing"],a:0,e:"Just-in-time permissions grant elevated access only for a limited task and time."},

{q:"An attacker tries 'Spring2026!' against hundreds of employee accounts. What attack is this?",opts:["Password spraying","Brute force","Passkey authentication","Magic link authentication"],a:0,e:"Password spraying uses one or a few common passwords across many accounts."},

{q:"An attacker uses leaked username-password pairs from one website to log in to another website. What attack is this?",opts:["Credential stuffing","Dictionary attack","Mandatory Access Control","Federation"],a:0,e:"Credential stuffing uses previously stolen credentials against other services."},

{q:"What is a vulnerability?",opts:["A weakness or flaw that can be exploited","A successful backup","A security policy","A confirmed user identity"],a:0,e:"A vulnerability is a weakness in hardware, software, configuration, or process that could be exploited."},

{q:"What is an attack?",opts:["A deliberate action to exploit a vulnerability","A normal software update","A secure configuration baseline","A backup verification"],a:0,e:"An attack is an intentional action by a threat actor to exploit a weakness."},

{q:"Which result can happen when a vulnerability is exploited?",opts:["Unauthorized access, data breach, or system disruption","Guaranteed system improvement","Automatic patching","Reduced attack surface"],a:0,e:"Exploited vulnerabilities can lead to unauthorized access, data breaches, malware infection, or disruption."},

{q:"Which objective explains various types of vulnerabilities?",opts:["Objective 2.3","Objective 5.5","Objective 1.1","Objective 3.5"],a:0,e:"Objective 2.3 focuses on different vulnerability types."},

{q:"Which objective focuses on mitigation techniques used to secure the enterprise?",opts:["Objective 2.5","Objective 1.2","Objective 5.1","Objective 3.4"],a:0,e:"Objective 2.5 focuses on mitigation techniques."},

{q:"Which objective focuses on applying common security techniques to computing resources?",opts:["Objective 4.1","Objective 5.4","Objective 1.1","Objective 2.1"],a:0,e:"Objective 4.1 focuses on applying security techniques to computing resources."},

{q:"Which is an example of a hardware vulnerability?",opts:["Outdated firmware","Strong multifactor authentication","Encrypted storage","Updated endpoint protection"],a:0,e:"Outdated firmware is a hardware-related vulnerability because firmware controls device behavior."},

{q:"What is firmware?",opts:["Specialized software stored on hardware devices","A phishing email","A cloud contract","A password manager"],a:0,e:"Firmware is low-level software stored on hardware devices, such as routers, printers, and embedded systems."},

{q:"Why are firmware vulnerabilities serious?",opts:["They may allow deep control of hardware devices","They only affect screen brightness","They cannot be exploited","They always fix themselves"],a:0,e:"Firmware compromise can give attackers strong control over a device and may be hard to detect."},

{q:"What does end-of-life mean for a system?",opts:["The manufacturer no longer provides updates or support","The system is brand new","The system has automatic protection","The system has unlimited warranty"],a:0,e:"End-of-life systems no longer receive vendor updates or support, making them risky."},

{q:"Why are end-of-life systems dangerous?",opts:["They may contain unpatched known vulnerabilities","They always have better security","They cannot connect to networks","They are automatically isolated"],a:0,e:"When updates stop, known vulnerabilities may remain exposed."},

{q:"What is a legacy system?",opts:["An older system that has been replaced by newer alternatives","A newly released system","A temporary password","A cloud-only function"],a:0,e:"A legacy system is outdated but may still be used because of business or compatibility needs."},

{q:"What is an unsupported system?",opts:["A system that no longer receives official support or patches","A system with full vendor support","A system that is always secure","A system that cannot run software"],a:0,e:"Unsupported systems do not receive official fixes, making security maintenance difficult."},

{q:"What is an unpatched system?",opts:["A device, application, or operating system missing current security updates","A fully updated server","A system with no vulnerabilities ever","A system protected by air gapping only"],a:0,e:"Unpatched systems lack the latest security fixes and are exposed to known attacks."},

{q:"Which mitigation best addresses unpatched systems?",opts:["Regular patching and update management","Disabling all logs","Sharing administrator accounts","Using default passwords"],a:0,e:"Patching fixes known vulnerabilities and reduces exploit risk."},

{q:"What is a hardware misconfiguration?",opts:["Incorrect device settings that create security or performance issues","A properly hardened system","A signed update","A strong access policy"],a:0,e:"Misconfiguration means settings are incorrect or insecure, often due to error or poor deployment."},

{q:"Which mitigation helps prevent hardware misconfigurations?",opts:["Baseline configuration enforcement","Password reuse","Open wireless access","Removing monitoring"],a:0,e:"Baseline enforcement ensures devices follow approved secure settings."},

{q:"What is hardening?",opts:["Reducing attack surface by disabling unnecessary services, closing ports, and setting secure permissions","Buying more devices","Allowing all traffic","Removing authentication"],a:0,e:"Hardening strengthens systems by removing unnecessary features and applying secure configurations."},

{q:"Why is isolation useful for vulnerable systems?",opts:["It limits exposure to the rest of the enterprise network","It makes vulnerabilities disappear","It gives users more privileges","It disables all security controls"],a:0,e:"Isolation limits how far an attacker can move if a vulnerable system is compromised."},

{q:"What is segmentation?",opts:["Dividing a network into smaller sections to limit breach impact","Deleting network diagrams","Putting every device on one flat network","Disabling firewalls"],a:0,e:"Segmentation limits lateral movement and reduces the blast radius of an attack."},

{q:"Which mitigation is best for old systems that cannot be safely updated?",opts:["Isolate, segment, and plan decommissioning","Expose them directly to the internet","Use default accounts","Disable monitoring"],a:0,e:"If old systems cannot be patched, compensating controls like isolation and decommissioning reduce risk."},

{q:"What is Bluetooth?",opts:["A short-distance wireless technology for exchanging data","A password cracking method","A cloud storage model","A physical destruction technique"],a:0,e:"Bluetooth is used for short-range wireless communication between devices."},

{q:"What is insecure Bluetooth pairing?",opts:["Devices connect without proper authentication","Devices connect only after strong verification","Bluetooth is turned off","Only trusted devices are allowed"],a:0,e:"Insecure pairing allows unauthorized or malicious devices to connect."},

{q:"What is Bluetooth device spoofing?",opts:["An attacker impersonates a trusted Bluetooth device","A user updates Bluetooth firmware","A device turns off Bluetooth","A user uses encryption"],a:0,e:"Device spoofing tricks a victim into connecting to a malicious device that appears trusted."},

{q:"What is a Bluetooth on-path attack?",opts:["Intercepting or altering communication between Bluetooth devices","Installing an app from an official store","Backing up phone data","Using cellular data"],a:0,e:"An on-path attack places the attacker between communicating devices to monitor or change traffic."},

{q:"What is Bluejacking?",opts:["Sending unsolicited messages to a Bluetooth device","Stealing contacts through Bluetooth","Taking control of Bluetooth functions","Crashing a Bluetooth device with traffic"],a:0,e:"Bluejacking is usually sending unwanted messages to a nearby Bluetooth device."},

{q:"What is Bluesnarfing?",opts:["Unauthorized access to steal information from a Bluetooth device","Sending harmless messages only","Turning Bluetooth off","Using a unique pairing code"],a:0,e:"Bluesnarfing steals information such as contacts, messages, or call logs from a Bluetooth device."},

{q:"What is Bluebugging?",opts:["Taking control of Bluetooth functions on a device","Sending only a prank message","Updating Bluetooth firmware","Using encryption for pairing"],a:0,e:"Bluebugging can allow attackers to control Bluetooth functions, such as calls or messages."},

{q:"What is Bluesmack?",opts:["A Bluetooth Denial of Service attack that overwhelms a device","A password spraying attack","A mobile app store review","A firmware update"],a:0,e:"Bluesmack attempts to crash or freeze Bluetooth devices by overwhelming them."},

{q:"What is BlueBorne?",opts:["A Bluetooth attack that can spread through the air without user interaction","A secure pairing method","A password manager feature","A patching policy"],a:0,e:"BlueBorne refers to Bluetooth vulnerabilities that may allow infection without user interaction."},

{q:"Which Bluetooth practice reduces attack surface?",opts:["Turn off Bluetooth when not in use","Keep Bluetooth discoverable forever","Accept all pairing requests","Use the same pairing code everywhere"],a:0,e:"Turning off Bluetooth reduces exposure to unsolicited connections and attacks."},

{q:"Why should Bluetooth devices be set to non-discoverable mode?",opts:["To reduce unsolicited connection attempts","To make pairing easier for attackers","To disable encryption","To expose the device name publicly"],a:0,e:"Non-discoverable mode makes it harder for unknown devices to find and target yours."},

{q:"Which Bluetooth practice is safest?",opts:["Only pair with known and trusted devices","Pair with any nearby device","Use no passkey","Ignore firmware updates"],a:0,e:"Pairing only with trusted devices reduces the chance of connecting to a malicious device."},

{q:"What is sideloading on mobile devices?",opts:["Installing apps from unofficial sources outside the default app store","Updating apps from the official store","Using a strong passcode","Encrypting the phone"],a:0,e:"Sideloading bypasses official app store checks and can introduce malware."},

{q:"Why is sideloading risky?",opts:["Unofficial apps may contain malware or unsafe code","It always improves app security","It guarantees updates","It disables malicious apps automatically"],a:0,e:"Apps from unofficial sources may not be reviewed and may include malicious code."},

{q:"What is jailbreaking or rooting?",opts:["Gaining elevated control over a mobile device beyond normal restrictions","Installing an official update","Using a strong password","Turning off Bluetooth"],a:0,e:"Jailbreaking or rooting removes normal restrictions and gives higher privileges."},

{q:"Why can jailbreaking or rooting increase risk?",opts:["It can bypass security controls and prevent normal updates","It always improves patching","It removes all malware risk","It disables every attack path"],a:0,e:"Rooted or jailbroken devices may lose security protections and may not receive normal updates."},

{q:"What is an insecure mobile connection method?",opts:["Using open wireless networks or pairing with unknown Bluetooth devices","Using official mobile data","Using known trusted devices","Using strong authentication"],a:0,e:"Open wireless networks and unknown Bluetooth pairings can expose mobile devices to attacks."},

{q:"Which tool helps enforce mobile security policies?",opts:["Mobile Device Management (MDM)","Bluejacking","Dictionary attack","Extensible Markup Language injection"],a:0,e:"Mobile Device Management can enforce patching, configuration, encryption, and app restrictions."},

{q:"Which Mobile Device Management feature helps reduce sideloading risk?",opts:["Preventing installation from unofficial sources","Opening all app sources","Disabling updates","Removing device encryption"],a:0,e:"Blocking sideloading helps keep apps limited to trusted sources."},

{q:"Which is a good mobile mitigation?",opts:["Patch devices and enforce secure configuration","Allow rooting on all corporate phones","Use public wireless networks for sensitive work","Ignore unknown pairing requests"],a:0,e:"Patch management and secure configuration reduce mobile vulnerabilities."},

{q:"What is a zero-day vulnerability?",opts:["A vulnerability discovered or exploited before a vendor patch is available","A vulnerability fixed years ago","A password used only once","A firewall rule with no traffic"],a:0,e:"A zero-day vulnerability is unknown or unpatched when attackers can exploit it."},

{q:"What is a zero-day exploit?",opts:["An attack that targets a previously unknown or unpatched vulnerability","A normal software update","A backup restore process","A security awareness quiz"],a:0,e:"A zero-day exploit uses a vulnerability before a known fix is available."},

{q:"Why are zero-day vulnerabilities difficult to defend against?",opts:["There may be no known patch or signature yet","They only affect old printers","They are always public for years","They cannot be used by attackers"],a:0,e:"Because zero-days are unknown or newly discovered, normal signature-based defenses may not detect them."},

{q:"Which defense can help against zero-day behavior?",opts:["Host-based intrusion prevention and suspicious behavior detection","Using default passwords","Disabling logs","Ignoring updates"],a:0,e:"Behavior-based controls can sometimes detect suspicious actions even when the exact vulnerability is unknown."},

{q:"Why do nation-state actors value zero-day vulnerabilities?",opts:["They can be used for high-value espionage or strategic operations","They are useless after discovery only","They are simple password policies","They are only for backups"],a:0,e:"Zero-days are valuable because they can bypass known defenses against important targets."},

{q:"Which is an operating system vulnerability?",opts:["Unpatched system files or insecure system configuration","A strong access control policy","Encrypted storage","A recent security update"],a:0,e:"Operating system vulnerabilities include unpatched systems, misconfigurations, and zero-days."},

{q:"Which protection helps reduce operating system vulnerabilities?",opts:["Patching and configuration management","Shared administrator passwords","Leaving services exposed","Disabling endpoint protection"],a:0,e:"Patching and configuration management reduce known weaknesses and insecure settings."},

{q:"Which protection helps limit data exposure on an operating system?",opts:["Encryption","Default passwords","Open guest access","No logging"],a:0,e:"Encryption helps protect data if a system is stolen or accessed without authorization."},

{q:"Which protection monitors and blocks malicious activity on endpoints?",opts:["Endpoint protection","Data remnants","Sideloading","Bluejacking"],a:0,e:"Endpoint protection detects and blocks malware or suspicious endpoint behavior."},

{q:"Which network controls can help protect operating systems?",opts:["Firewalls and intrusion prevention systems","Default passwords and open ports","Untrusted Bluetooth pairing","No patching"],a:0,e:"Firewalls and intrusion prevention systems help reduce exposure and detect or block malicious traffic."},

{q:"What is Structured Query Language injection?",opts:["Injecting malicious database commands through vulnerable input handling","Sending unsolicited Bluetooth messages","Installing an unofficial mobile app","Physically damaging a server"],a:0,e:"Structured Query Language injection abuses poor input handling to affect database queries."},

{q:"What is the main target of Structured Query Language injection?",opts:["Databases behind web applications","Bluetooth headsets only","Physical door locks","Mobile charging cables"],a:0,e:"Structured Query Language injection targets application database queries."},

{q:"What can Structured Query Language injection lead to?",opts:["Unauthorized data access, data changes, or authentication bypass","Stronger password storage","Automatic patching","Bluetooth encryption"],a:0,e:"If successful, it may expose or alter database information or bypass login logic."},

{q:"What is Extensible Markup Language injection?",opts:["Abusing vulnerable Extensible Markup Language processing","Stealing data through Bluetooth pairing","Guessing passwords from a dictionary","Crashing a device with too many packets"],a:0,e:"Extensible Markup Language injection targets applications that process Extensible Markup Language input insecurely."},

{q:"Which mitigation helps prevent injection attacks?",opts:["Input validation and parameterized queries","Using default administrator accounts","Disabling all logs","Accepting all user input as trusted"],a:0,e:"Input validation and parameterized queries help prevent user input from being treated as executable commands."},

{q:"Why is direct string concatenation risky in database queries?",opts:["User input may become part of executable Structured Query Language commands","It always encrypts data","It prevents injection","It removes all database risk"],a:0,e:"Unsafe string concatenation can allow attacker-controlled input to change the meaning of a database query."},

{q:"Which is the best defensive coding practice against Structured Query Language injection?",opts:["Use parameterized queries or prepared statements","Trust all form fields","Disable authentication","Store passwords in plain text"],a:0,e:"Parameterized queries separate user input from executable database logic."},

{q:"Which control helps identify injection attempts after deployment?",opts:["Application logging and monitoring","Ignoring error messages","Allowing detailed database errors to users","Turning off alerts"],a:0,e:"Logging and monitoring can detect suspicious input patterns and repeated attack attempts."},

{q:"Why should error messages be limited in web applications?",opts:["Detailed errors may reveal database or application structure","They always improve security","They prevent all injections","They encrypt user input"],a:0,e:"Verbose error messages can leak information attackers use to refine attacks."},

{q:"A router has old firmware with a known flaw. What type of issue is this?",opts:["Hardware or firmware vulnerability","Bluejacking","Federation","Passwordless authentication"],a:0,e:"Routers rely on firmware, so outdated firmware is a hardware-related security weakness."},

{q:"An employee installs a corporate app from an unofficial website instead of the official store. What is this?",opts:["Sideloading","BlueBorne","Data segmentation","Operating system patching"],a:0,e:"Installing apps from unofficial sources is sideloading."},

{q:"A phone receives unwanted Bluetooth messages from a nearby device. What attack is this?",opts:["Bluejacking","Bluesnarfing","Structured Query Language injection","Zero-day exploit"],a:0,e:"Bluejacking involves sending unsolicited messages to Bluetooth devices."},

{q:"A Bluetooth attacker steals contacts and call logs from a nearby phone. What attack is this?",opts:["Bluesnarfing","Bluejacking","Bluesmack","Sideloading"],a:0,e:"Bluesnarfing is unauthorized Bluetooth access used to steal information."},

{q:"A Bluetooth device crashes after being overwhelmed with traffic. What attack is this?",opts:["Bluesmack","Bluejacking","Credential stuffing","Extensible Markup Language injection"],a:0,e:"Bluesmack is a Bluetooth Denial of Service style attack."},

{q:"A vulnerability is being exploited before the vendor has released a patch. What is it?",opts:["Zero-day vulnerability","Legacy support","Baseline configuration","Standard patch cycle"],a:0,e:"A zero-day is exploited or discovered before a patch is available."},

{q:"A company reduces risk by closing unused ports and disabling unnecessary services. What is this?",opts:["Hardening","Bluebugging","Sideloading","Credential stuffing"],a:0,e:"Hardening reduces attack surface by removing unnecessary exposure."},

{q:"A vulnerable legacy system cannot be patched, so the company places it on a restricted network. What mitigation is this?",opts:["Isolation or segmentation","Password spraying","Bluejacking","Application sideloading"],a:0,e:"Isolation and segmentation limit exposure and reduce the impact of compromise."},

{q:"What is Structured Query Language injection mainly targeting?",opts:["Bluetooth pairing","Database queries behind an application","Physical door locks","Cloud billing reports"],a:1,e:"Structured Query Language injection targets insecure database queries by making user input affect the query logic."},

{q:"Which defense best reduces Structured Query Language injection risk?",opts:["Parameterized queries","Default passwords","Open database ports","Verbose error messages"],a:0,e:"Parameterized queries separate user input from database commands, which helps prevent injection."},

{q:"Why are detailed database error messages dangerous?",opts:["They make passwords longer","They may reveal table names, query structure, or backend details","They prevent injection automatically","They disable logging"],a:1,e:"Detailed errors can help attackers understand the application and improve their attack attempts."},

{q:"What is Extensible Markup Language injection?",opts:["An attack against insecure Extensible Markup Language processing","A Bluetooth denial attack","A password reuse attack","A physical access attack"],a:0,e:"Extensible Markup Language injection abuses applications that process Extensible Markup Language input insecurely."},

{q:"Which attack injects malicious scripts into trusted web pages?",opts:["Directory traversal","Cross-Site Scripting","Replay attack","Domain hijacking"],a:1,e:"Cross-Site Scripting injects malicious scripts into web pages viewed by users."},

{q:"What is Cross-Site Request Forgery?",opts:["Forcing a logged-in user’s browser to perform an unwanted action","Stealing files using folder paths","Overwriting memory buffers","Flooding a target with traffic"],a:0,e:"Cross-Site Request Forgery tricks a user’s browser into sending an unwanted request while the user is authenticated."},

{q:"Which attack mainly abuses a user’s active authenticated session?",opts:["Cross-Site Request Forgery","Bluejacking","Fork bomb","Zone transfer"],a:0,e:"Cross-Site Request Forgery relies on the victim already being authenticated to the target site."},

{q:"Which mitigation helps reduce Cross-Site Request Forgery?",opts:["Anti-forgery tokens","Leaving sessions open forever","Disabling input validation","Using shared accounts"],a:0,e:"Anti-forgery tokens help confirm that a request came from the legitimate user interaction."},

{q:"What is the main difference between Cross-Site Scripting and Cross-Site Request Forgery?",opts:["Cross-Site Scripting runs malicious script; Cross-Site Request Forgery sends unwanted authenticated requests","They are exactly the same","Cross-Site Scripting only attacks Bluetooth","Cross-Site Request Forgery only attacks hardware"],a:0,e:"Cross-Site Scripting focuses on script execution in the browser, while Cross-Site Request Forgery abuses trusted authenticated requests."},

{q:"What is a buffer overflow?",opts:["A situation where too much data is written into memory space","A Domain Name System lookup failure","A password spraying attempt","A cloud storage policy"],a:0,e:"A buffer overflow occurs when more data is written to a memory buffer than it can hold."},

{q:"Why can buffer overflows be dangerous?",opts:["They can corrupt memory and may allow code execution","They only improve performance","They automatically patch software","They prevent malware"],a:0,e:"Buffer overflows can crash systems or allow attackers to influence program execution."},

{q:"Which coding practice helps reduce buffer overflow risk?",opts:["Bounds checking","Using default credentials","Disabling logging","Allowing unlimited input"],a:0,e:"Bounds checking ensures input does not exceed the expected memory size."},

{q:"What is a race condition?",opts:["A vulnerability caused when timing or order of operations creates unexpected behavior","A wireless pairing method","A password cracking list","A backup type"],a:0,e:"A race condition happens when multiple operations access shared resources and timing affects the result."},

{q:"What does Time-of-Check mean in a race condition?",opts:["The moment a condition or permission is checked","The moment the system is turned off","The moment logs are deleted","The moment a user changes a password"],a:0,e:"Time-of-Check is when the system verifies a condition, permission, or state."},

{q:"What does Time-of-Use mean in a race condition?",opts:["The moment the checked resource is actually used","The time a user spends studying","The time a backup starts","The time a firewall boots"],a:0,e:"Time-of-Use is when the system acts on or uses the resource after checking it."},

{q:"Why are Time-of-Check to Time-of-Use issues risky?",opts:["The condition may change between the check and the use","They always encrypt data","They only affect printers","They prevent privilege escalation"],a:0,e:"A Time-of-Check to Time-of-Use flaw happens when a system checks something, then the situation changes before use."},

{q:"What is a Distributed Denial of Service attack?",opts:["One user forgetting a password","Many systems overwhelming one target with traffic","A single database backup","A normal software patch"],a:1,e:"A Distributed Denial of Service attack uses multiple systems to overwhelm a target and make it unavailable."},

{q:"What is the main goal of a Distributed Denial of Service attack?",opts:["Improve availability","Force a service offline or make it unavailable","Encrypt only local files","Patch vulnerable systems"],a:1,e:"The goal is to disrupt availability by overwhelming the target."},

{q:"Which resource is commonly used to perform Distributed Denial of Service attacks?",opts:["Botnet","Password manager","Clean backup","Access badge"],a:0,e:"Attackers often use botnets, which are networks of compromised devices, to generate large traffic floods."},

{q:"What is a SYN flood?",opts:["A flood of incomplete Transmission Control Protocol connection attempts","A Domain Name System signing method","A secure login process","A file deletion method"],a:0,e:"A SYN flood starts many connection handshakes but does not complete them, consuming server resources."},

{q:"Which mitigation can help against smaller denial of service attacks?",opts:["Intrusion prevention system","Public default credentials","No monitoring","Open recursive Domain Name System"],a:0,e:"An intrusion prevention system can help identify and block some denial of service patterns."},

{q:"What is a black hole or sinkhole in denial of service defense?",opts:["Routing malicious traffic to a null or non-existent destination","Encrypting user passwords","Changing file permissions","Running a phishing simulation"],a:0,e:"A sinkhole redirects attack traffic away from the target, often to a null interface."},

{q:"Why can elastic cloud infrastructure help during denial of service attacks?",opts:["It can scale resources to handle sudden traffic spikes","It disables all attackers permanently","It removes all costs","It guarantees perfect security"],a:0,e:"Elastic cloud infrastructure can temporarily scale capacity to absorb more traffic."},

{q:"What is a Permanent Denial of Service attack?",opts:["An attack that damages or re-flashes firmware so a device may need full recovery","A temporary login delay","A normal password reset","A Cross-Site Request Forgery token"],a:0,e:"Permanent Denial of Service attacks can damage devices by corrupting firmware or making them unusable."},

{q:"What is a fork bomb?",opts:["A process that creates many processes until resources are exhausted","A Domain Name System cache attack","A web session cookie","A wireless encryption method"],a:0,e:"A fork bomb rapidly creates many processes, consuming system resources and causing denial of service."},

{q:"What does Domain Name System do?",opts:["Translates human-friendly domain names into Internet Protocol addresses","Encrypts hard drives","Stores biometric templates","Runs mobile applications"],a:0,e:"Domain Name System maps names like websites to Internet Protocol addresses computers use."},

{q:"What is Domain Name System cache poisoning?",opts:["Corrupting a resolver cache with false information","Making a password longer","Flooding Bluetooth devices","Installing official updates"],a:0,e:"Domain Name System cache poisoning inserts false records so users may be redirected to malicious destinations."},

{q:"Which control helps protect Domain Name System records using digital signatures?",opts:["Domain Name System Security Extensions","Simple Mail Transfer Protocol","Extensible Markup Language parser","Virtual local area network trunking"],a:0,e:"Domain Name System Security Extensions add digital signatures to help validate Domain Name System data."},

{q:"What is Domain Name System amplification?",opts:["Using spoofed requests to make Domain Name System servers flood a victim with large responses","Stealing passwords from memory","Injecting scripts into a page","Changing a file path"],a:0,e:"Domain Name System amplification abuses open Domain Name System servers to send large response traffic to a victim."},

{q:"Which mitigation helps reduce Domain Name System amplification impact?",opts:["Rate limiting Domain Name System responses","Using default administrator passwords","Allowing unlimited recursive queries","Disabling all logs"],a:0,e:"Rate limiting can reduce how much Domain Name System response traffic is sent."},

{q:"What is Domain Name System tunneling?",opts:["Carrying non-Domain Name System traffic inside Domain Name System queries","Encrypting only local folders","Sending unwanted Bluetooth messages","Resetting user passwords"],a:0,e:"Domain Name System tunneling hides other traffic inside Domain Name System traffic, often to bypass controls."},

{q:"What is a common sign of Domain Name System tunneling?",opts:["Unusual Domain Name System query patterns","A user changing wallpaper","A printer running out of paper","A locked office door"],a:0,e:"Unusual Domain Name System traffic volume, frequency, or query patterns may indicate tunneling."},

{q:"What is domain hijacking?",opts:["Unauthorized change or takeover of domain registration","A password brute force attack","A normal web redirect","A memory corruption bug"],a:0,e:"Domain hijacking occurs when attackers gain unauthorized control over a domain’s registration."},

{q:"What is a Domain Name System zone transfer attack?",opts:["Attempting to copy full Domain Name System zone data","Trying every password combination","Injecting scripts into a webpage","Overloading memory"],a:0,e:"A zone transfer attack tries to obtain domain records that may reveal internal infrastructure information."},

{q:"What is directory traversal?",opts:["Using manipulated paths to access files outside the intended directory","Flooding a server with traffic","Taking over Domain Name System records","Sending a fake login link"],a:0,e:"Directory traversal abuses file path handling to access files outside the web root or intended folder."},

{q:"Which pattern is commonly associated with directory traversal attempts?",opts:["Repeated parent-directory path movement","One-time password codes","Biometric scans","Valid anti-forgery tokens"],a:0,e:"Directory traversal often uses parent-directory movement patterns to move outside the allowed folder."},

{q:"Why do attackers encode directory traversal attempts?",opts:["To hide suspicious path characters from filters or logs","To improve password strength","To make backups faster","To enable multifactor authentication"],a:0,e:"Encoding can disguise dangerous path patterns so simple filters may miss them."},

{q:"What is file inclusion?",opts:["A web vulnerability allowing unauthorized local or remote file loading","A secure file backup","A biometric login factor","A network segmentation control"],a:0,e:"File inclusion lets attackers make an application load files it should not load."},

{q:"What is the difference between local file inclusion and remote file inclusion?",opts:["Local uses files on the server; remote tries to load files from an outside location","They are the exact same attack","Local only affects Bluetooth","Remote only affects passwords"],a:0,e:"Local file inclusion abuses files already on the server, while remote file inclusion loads external files."},

{q:"Which defense helps prevent directory traversal and file inclusion?",opts:["Proper input validation and safe file path handling","Verbose file errors","Trusting all user input","Open file permissions"],a:0,e:"Input validation and safe file handling prevent users from controlling dangerous file paths."},

{q:"What is arbitrary code execution?",opts:["A weakness allowing an attacker to run code without intended restrictions","A normal login process","A secure backup process","A Domain Name System lookup"],a:0,e:"Arbitrary code execution means attacker-controlled code can run on the target."},

{q:"What is remote code execution?",opts:["Arbitrary code execution performed over a network or internet connection","A local password reset","A physical lock bypass","A clean software install"],a:0,e:"Remote code execution means the attacker can run code remotely, often over the network."},

{q:"What is privilege escalation?",opts:["Gaining higher permissions than originally assigned","Losing access to a system","Changing a username only","Backing up data"],a:0,e:"Privilege escalation means moving from lower permissions to more powerful access."},

{q:"What is vertical privilege escalation?",opts:["Moving from normal user to administrator or root-level privileges","Accessing another user’s data at the same privilege level","Forcing a web browser request","Flooding a server"],a:0,e:"Vertical privilege escalation increases privilege level, such as user to administrator."},

{q:"What is horizontal privilege escalation?",opts:["Accessing another user’s resources at the same permission level","Moving from user to administrator","Re-flashing firmware","Breaking Domain Name System signatures"],a:0,e:"Horizontal privilege escalation means abusing access to reach peer-level resources that should not be available."},

{q:"Why are rootkits dangerous?",opts:["They can hide their presence and maintain privileged access","They only send Bluetooth messages","They only change web page colors","They only improve patching"],a:0,e:"Rootkits conceal activity and can provide persistence, often with high-level control."},

{q:"Why is a kernel-mode rootkit especially serious?",opts:["It operates at the highest privilege level","It only runs in a browser tab","It cannot hide from security tools","It has no system access"],a:0,e:"Kernel-mode rootkits operate close to the operating system core and can have extensive control."},

{q:"What is a replay attack?",opts:["Rebroadcasting captured valid data transmissions later","Injecting scripts into a webpage","Flooding a target with random traffic only","Changing domain ownership"],a:0,e:"A replay attack captures valid data and resends it later to repeat an action or authentication."},

{q:"How is a replay attack different from session hijacking?",opts:["Replay resends captured data later; session hijacking takes over or alters an active session","They are always the same","Replay only affects Bluetooth","Session hijacking only affects physical locks"],a:0,e:"Replay attacks reuse captured transmissions, while session hijacking focuses on taking over a live session."},

{q:"Which control helps reduce replay attacks?",opts:["Timestamps, nonces, and session tokens","Default passwords","Open wireless networks","No encryption"],a:0,e:"Freshness controls like timestamps and nonces make old captured messages less useful."},

{q:"What is session hijacking?",opts:["Taking over a valid user session","Making a backup copy","Updating a phone app","Changing a printer setting"],a:0,e:"Session hijacking occurs when an attacker gains control of a legitimate session."},

{q:"Which item is commonly targeted in session hijacking?",opts:["Session cookie or session token","Printer paper tray","Keyboard color","Office badge photo"],a:0,e:"Attackers often target session cookies or tokens because they represent authenticated sessions."},

{q:"What is an on-path attack?",opts:["An attacker secretly positions themselves between two communicating parties","A user typing a wrong password","A local file deletion","A normal Domain Name System lookup"],a:0,e:"In an on-path attack, the attacker intercepts or may alter communication between two parties."},

{q:"What is the main risk of an on-path attack?",opts:["Traffic can be observed, captured, or modified","Backups become faster","Passwords become stronger","Domain records automatically update"],a:0,e:"On-path attackers can monitor or manipulate communications if protections are weak."},

{q:"Which control helps protect against on-path attacks?",opts:["Encryption such as Transport Layer Security","Plaintext communication","Open wireless networks","Accepting invalid certificates"],a:0,e:"Strong encryption and certificate validation help protect traffic from interception and modification."},

{q:"What are indicators of compromise?",opts:["Signs that a system or account may have been attacked or compromised","Official software updates","Approved firewall rules","Normal business goals"],a:0,e:"Indicators of compromise are clues such as unusual behavior, suspicious logs, or unexpected system activity."},

{q:"Which is an indicator of compromise related to user accounts?",opts:["Account lockouts or unusual concurrent sessions","A scheduled maintenance window","A normal password change by policy","An approved software install"],a:0,e:"Unexpected lockouts or concurrent sessions may indicate attack activity."},

{q:"What does impossible travel indicate?",opts:["A user account appears to log in from distant locations too quickly","A server ran out of disk space","A printer jam occurred","A backup finished correctly"],a:0,e:"Impossible travel suggests account compromise because one person could not physically move between locations that fast."},

{q:"Which system behavior can indicate compromise?",opts:["Unusual resource consumption","Normal patch installation","Approved maintenance","Expected user login"],a:0,e:"Unexpected high central processing unit, memory, disk, or network use may indicate malicious activity."},

{q:"Why are missing logs suspicious?",opts:["Attackers may delete logs to hide activity","Logs are never useful","Missing logs prove no attack happened","Logs only matter for printers"],a:0,e:"Missing logs can indicate that an attacker or malware tried to cover tracks."},

{q:"Which is a possible indicator of compromise after a web attack?",opts:["Unexpected files, changed pages, or unusual web requests","A normal successful backup","A scheduled policy review","A user reading email"],a:0,e:"Unexpected web content, files, or request patterns may indicate compromise."},

{q:"A website login suddenly accepts input that changes database behavior. What attack category is most likely?",opts:["Injection attack","Bluetooth attack","Physical attack","Domain registration attack"],a:0,e:"When user input changes backend command behavior, it is likely an injection issue."},

{q:"A user clicks a link while logged in and unknowingly changes account settings. What attack is most likely?",opts:["Cross-Site Request Forgery","Buffer overflow","Domain Name System tunneling","Fork bomb"],a:0,e:"Cross-Site Request Forgery can cause a logged-in browser to perform unwanted actions."},

{q:"A webpage stores and displays attacker-provided script to other users. What attack is most likely?",opts:["Cross-Site Scripting","Zone transfer","Replay attack","Permanent Denial of Service"],a:0,e:"Stored Cross-Site Scripting occurs when malicious script is saved and later displayed to users."},

{q:"A server becomes unavailable because thousands of compromised devices flood it. What attack is this?",opts:["Distributed Denial of Service","Directory traversal","Horizontal privilege escalation","Extensible Markup Language injection"],a:0,e:"A Distributed Denial of Service attack uses many compromised systems to overwhelm one target."},

{q:"A user account logs in from Canada and two minutes later from another continent. What is this?",opts:["Impossible travel indicator","Normal multifactor authentication","Clean session logout","Approved access review"],a:0,e:"Impossible travel is an indicator that credentials or sessions may be compromised."},

{q:"What is the main purpose of a secure baseline?",opts:["To define a known good secure configuration","To remove all monitoring","To let users choose any settings","To replace patching"],a:0,e:"A secure baseline is a known good configuration used as a standard for deploying and maintaining systems securely."},

{q:"Why is a secure baseline useful?",opts:["It keeps systems consistent and easier to audit","It makes every system different","It disables security policies","It removes the need for updates"],a:0,e:"Secure baselines help enforce consistent settings, reduce misconfiguration, and support auditing."},

{q:"Which step usually comes before creating a secure baseline image?",opts:["Scan for vulnerabilities and remediate them","Delete all logs","Disable encryption","Give all users administrator access"],a:0,e:"Before creating a known good image, vulnerabilities should be scanned and fixed."},

{q:"What is a known good image?",opts:["A trusted system image based on approved secure configuration","A random backup from any device","A user screenshot","A deleted virtual machine"],a:0,e:"A known good image is a trusted baseline image used to deploy systems consistently."},

{q:"Which tool can enforce secure baselines in Windows environments?",opts:["Group Policy Objects","Simple Mail Transfer Protocol","Domain Name System cache","Bluetooth pairing"],a:0,e:"Group Policy Objects can enforce user rights, audit settings, and configuration policies in Windows."},

{q:"What should happen during secure baseline maintenance?",opts:["Regular audits, monitoring, and updates to the baseline","Never reviewing settings again","Allowing users to change anything","Removing alerts"],a:0,e:"Baselines must be reviewed and updated as systems, threats, and business needs change."},

{q:"What does deviation from a secure baseline mean?",opts:["A system setting no longer matches the approved secure configuration","The system is automatically safer","The device has no software","The user has completed training"],a:0,e:"A baseline deviation means a system differs from the approved secure configuration and may need remediation."},

{q:"What is wireless infrastructure security?",opts:["Securing wireless networks, access points, coverage, and configuration","Only encrypting hard drives","Only securing email","Only managing physical locks"],a:0,e:"Wireless infrastructure security protects wireless access points, signal coverage, authentication, and encryption."},

{q:"Why does wireless access point placement matter?",opts:["It affects coverage, performance, and signal leakage","It only changes the device color","It disables encryption","It replaces passwords"],a:0,e:"Poor placement can create dead zones or leak signal outside the intended area."},

{q:"Where should wireless access points usually be placed for better coverage?",opts:["Central locations","Outside near windows","Only in parking lots","Behind metal cabinets"],a:0,e:"Central placement usually gives better coverage and reduces unnecessary signal leakage."},

{q:"Why should wireless access points usually not be placed near external walls or windows?",opts:["The signal may leak outside the building","They cannot use electricity there","They become immune to attacks","They stop broadcasting completely"],a:0,e:"Placing access points near outside walls can expose wireless signals to outsiders."},

{q:"What is a site survey used for in wireless networking?",opts:["Planning access point placement and identifying interference","Deleting wireless logs","Changing user passwords","Blocking all network access"],a:0,e:"A site survey checks coverage, interference, and best locations for wireless access points."},

{q:"What is a wireless heat map?",opts:["A visual map of wireless coverage and signal strength","A list of user passwords","A firewall deny rule","A backup report"],a:0,e:"A heat map shows signal strength, coverage, dead zones, and possible signal leakage."},

{q:"What is co-channel interference?",opts:["Multiple access points using the same channel and interfering with each other","A user forgetting a password","An email spoofing attack","A secure protocol selection"],a:0,e:"Co-channel interference happens when wireless devices compete on the same channel."},

{q:"In the 2.4 gigahertz band, which channels are commonly used to avoid overlap?",opts:["1, 6, and 11","2, 4, and 8","3, 7, and 13","5, 10, and 14"],a:0,e:"Channels 1, 6, and 11 are commonly used because they do not overlap in 2.4 gigahertz wireless networks."},
