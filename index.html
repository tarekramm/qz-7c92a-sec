{q:"Which wireless security protocol is the newest and strongest option listed here?",opts:["Wi-Fi Protected Access 3","Wired Equivalent Privacy","Wi-Fi Protected Access","Telnet"],a:0,e:"Wi-Fi Protected Access 3 is the latest major wireless security protocol and improves authentication and encryption."},

{q:"Which wireless protocol introduced stronger encryption using Advanced Encryption Standard?",opts:["Wi-Fi Protected Access 2","Wired Equivalent Privacy","Telnet","File Transfer Protocol"],a:0,e:"Wi-Fi Protected Access 2 uses Advanced Encryption Standard with stronger protection than older wireless standards."},

{q:"What does Authentication, Authorization, and Accounting provide in enterprise wireless security?",opts:["Central authentication, permission control, and activity tracking","Only signal strength","Only antenna direction","Only encryption keys"],a:0,e:"Authentication, Authorization, and Accounting supports identity verification, access decisions, and logging."},

{q:"What is Remote Authentication Dial-In User Service used for in wireless security?",opts:["Centralized authentication for network access","Destroying old hard drives","Scanning source code","Filtering spam only"],a:0,e:"Remote Authentication Dial-In User Service is commonly used for centralized network authentication."},

{q:"What is application security?",opts:["Protecting software from design, coding, and deployment weaknesses","Only protecting wireless routers","Only checking physical access","Only encrypting email"],a:0,e:"Application security focuses on reducing vulnerabilities in software and how it is deployed."},

{q:"Why is input validation important?",opts:["It checks user input before the application processes it","It disables all users","It removes all logs","It guarantees no bugs exist"],a:0,e:"Input validation reduces attacks where malicious input is used to affect application behavior."},

{q:"Which attack can input validation help prevent?",opts:["Injection attacks","A power outage","Physical theft only","Wireless interference"],a:0,e:"Input validation helps prevent malicious input from becoming commands or scripts."},

{q:"What is a secure cookie?",opts:["A cookie protected with security attributes to reduce theft or misuse","A cookie with no expiration and no protection","A wireless encryption key","A Domain Name System record"],a:0,e:"Secure cookies use attributes such as secure transmission and restricted script access to protect session data."},

{q:"What is static code analysis?",opts:["Reviewing code without running it","Testing the application while it is running","Monitoring wireless channels","Filtering email spam"],a:0,e:"Static code analysis examines source code or compiled code without executing the application."},

{q:"What is dynamic code analysis?",opts:["Testing code while it runs","Reading code without execution","Creating a password policy","Turning off a wireless access point"],a:0,e:"Dynamic analysis tests an application during execution to observe real behavior."},

{q:"Which is the key difference between static and dynamic code analysis?",opts:["Static reviews code without running it; dynamic tests the running application","Static only checks wireless networks","Dynamic only checks physical locks","They are exactly the same"],a:0,e:"Static analysis looks at code, while dynamic analysis observes behavior during runtime."},

{q:"What is code signing?",opts:["Digitally signing software to prove origin and integrity","Encrypting all network traffic only","Deleting old applications","Changing wireless channels"],a:0,e:"Code signing helps users and systems verify that software comes from a trusted source and was not modified."},

{q:"What is sandboxing?",opts:["Running code in an isolated environment","Giving code full administrator access","Removing all application monitoring","Disabling access control"],a:0,e:"Sandboxing limits what an application can affect by isolating it from the rest of the system."},

{q:"What is Network Access Control?",opts:["A system that checks devices and users before allowing network access","A password cracking tool","A Domain Name System attack","An email encryption method"],a:0,e:"Network Access Control enforces access policies before or during network connection."},

{q:"What can Network Access Control check before allowing a device on the network?",opts:["Device health, identity, compliance, and security posture","The user’s favorite browser","The color of the laptop","The office temperature"],a:0,e:"Network Access Control can check whether a device meets security requirements before granting access."},

{q:"What might Network Access Control do to a non-compliant device?",opts:["Quarantine it or limit its access","Give it administrator access","Disable all monitoring","Approve it automatically"],a:0,e:"Non-compliant devices may be isolated, quarantined, or given limited access until fixed."},

{q:"Which example best fits Network Access Control?",opts:["Blocking a laptop from the corporate network because antivirus is missing","Changing a wireless channel","Signing application code","Filtering spam email"],a:0,e:"Network Access Control can enforce endpoint requirements like antivirus, patches, or encryption."},

{q:"What is web filtering?",opts:["Blocking or allowing websites based on policy, category, or reputation","Encrypting local hard drives","Changing wireless antenna direction","Creating new user accounts"],a:0,e:"Web filtering controls access to websites based on organizational rules."},

{q:"What is Domain Name System filtering?",opts:["Blocking malicious or unwanted domains during name resolution","Disabling all web browsers","Scanning application source code","Encrypting email attachments"],a:0,e:"Domain Name System filtering prevents users from reaching blocked or malicious domains."},

{q:"What is reputation-based filtering?",opts:["Allowing or blocking content based on known trust or risk reputation","Filtering only by file size","Disabling all certificates","Approving every unknown site"],a:0,e:"Reputation-based filtering uses threat intelligence or reputation scores to judge whether a site or domain is risky."},

{q:"What is Uniform Resource Locator scanning?",opts:["Checking links for malicious or suspicious destinations","Checking password length only","Creating firewall hardware","Pairing Bluetooth devices"],a:0,e:"Uniform Resource Locator scanning inspects links to detect phishing, malware, or unsafe destinations."},

{q:"What is content categorization in web filtering?",opts:["Grouping websites into categories like gambling, malware, or social media","Encrypting web traffic","Changing user roles","Signing software updates"],a:0,e:"Content categorization lets organizations block or allow websites based on category."},

{q:"What is an agent-based web filter?",opts:["Filtering software installed on the endpoint","A filter only installed in a physical router","A passwordless login token","A Domain Name System zone file"],a:0,e:"Agent-based filtering uses endpoint software to enforce web access rules."},

{q:"What is a centralized proxy used for?",opts:["Routing and inspecting web traffic through a central control point","Storing user fingerprints","Creating wireless heat maps","Replacing all firewalls"],a:0,e:"A centralized proxy can enforce web policies, inspect traffic, and log activity."},

{q:"What is Sender Policy Framework used for?",opts:["Checking whether a mail server is authorized to send email for a domain","Encrypting wireless traffic","Scanning source code","Running endpoint forensics"],a:0,e:"Sender Policy Framework helps detect spoofed email by validating allowed sending servers."},

{q:"What is DomainKeys Identified Mail used for?",opts:["Digitally signing email so recipients can verify authenticity and integrity","Blocking wireless interference","Creating application sandboxes","Performing code analysis"],a:0,e:"DomainKeys Identified Mail uses cryptographic signatures to verify that email was not altered and came from an authorized domain."},

{q:"What is Domain-based Message Authentication, Reporting, and Conformance used for?",opts:["Setting email authentication policy and handling failures","Choosing wireless channels","Checking endpoint memory","Creating secure baselines"],a:0,e:"Domain-based Message Authentication, Reporting, and Conformance works with Sender Policy Framework and DomainKeys Identified Mail to reduce spoofing."},

{q:"Which email security control helps prevent domain spoofing?",opts:["Sender Policy Framework, DomainKeys Identified Mail, and Domain-based Message Authentication, Reporting, and Conformance","Open relay configuration","Plaintext passwords","Unfiltered attachments"],a:0,e:"These email authentication protocols help verify sender legitimacy and reduce spoofing."},

{q:"What does an email gateway do?",opts:["Routes, filters, secures, and enforces policy on email traffic","Only stores wireless passwords","Only manages Domain Name System records","Only scans source code"],a:0,e:"Email gateways handle routing, security filtering, encryption, and policy enforcement for email."},

{q:"Which protocol is commonly used by email gateways to send and receive email?",opts:["Simple Mail Transfer Protocol","Secure Shell","Hypertext Transfer Protocol Secure","Domain Name System Security Extensions"],a:0,e:"Simple Mail Transfer Protocol is used for sending and receiving email between mail systems."},

{q:"What is spam filtering?",opts:["Detecting and blocking unwanted or unsolicited email","Blocking all secure websites","Detecting wireless dead zones","Encrypting mobile devices"],a:0,e:"Spam filtering identifies unwanted email and can move it to spam folders or block it."},

{q:"What is Endpoint Detection and Response?",opts:["A tool category that monitors endpoints and supports detection, investigation, and response","A wireless antenna type","A Domain Name System signing method","A password format"],a:0,e:"Endpoint Detection and Response collects endpoint activity and helps detect, investigate, and respond to threats."},

{q:"What kind of data can Endpoint Detection and Response collect?",opts:["Processes, registry changes, memory usage, and network activity","Only employee birthdays","Only wireless heat maps","Only invoice numbers"],a:0,e:"Endpoint Detection and Response collects endpoint telemetry such as process behavior, memory use, and network patterns."},

{q:"What can Endpoint Detection and Response do after detecting a threat?",opts:["Alert, investigate, remediate, or isolate the endpoint","Approve all traffic","Disable all logs","Delete the baseline"],a:0,e:"Endpoint Detection and Response supports alerts, investigation, remediation, and containment actions."},

{q:"What is file integrity monitoring?",opts:["Checking critical files against a known good baseline","Blocking websites by category","Signing email messages","Scanning wireless channels"],a:0,e:"File integrity monitoring compares file state or hash values against a known good baseline to detect unauthorized changes."},

{q:"What is Extended Detection and Response?",opts:["A platform that correlates detection data across multiple security layers","A wireless encryption protocol","An email-only spam rule","A type of password"],a:0,e:"Extended Detection and Response combines data across endpoints, networks, cloud, and other layers to improve detection and response."},

{q:"What is User Behavior Analytics?",opts:["Using analytics to detect unusual user activity","Only scanning source code","Only blocking wireless channels","Only routing email"],a:0,e:"User Behavior Analytics builds behavior patterns and flags deviations that may indicate compromise or insider risk."},

{q:"Which event could User Behavior Analytics flag as suspicious?",opts:["A user downloads huge amounts of data at midnight unexpectedly","A user logs in at normal hours from their normal device","A scheduled patch installs successfully","A normal backup completes"],a:0,e:"User Behavior Analytics looks for abnormal behavior compared with a user’s normal pattern."},

{q:"Why is User Behavior Analytics useful for insider threats?",opts:["It can detect unusual actions by legitimate accounts","It prevents all password attacks","It replaces access control","It disables all user accounts"],a:0,e:"Insider threats may use valid accounts, so behavior anomalies can reveal suspicious activity."},

{q:"What is secure protocol selection?",opts:["Choosing protocols that provide proper confidentiality, integrity, and authentication","Choosing the oldest protocol available","Disabling encryption for performance","Using default passwords"],a:0,e:"Secure protocol selection means choosing protocols that protect data and identity properly."},

{q:"Which protocol is generally preferred for secure remote administration?",opts:["Secure Shell","Telnet","File Transfer Protocol","Hypertext Transfer Protocol"],a:0,e:"Secure Shell encrypts remote administration traffic, unlike Telnet."},

{q:"Which protocol is generally preferred for secure websites?",opts:["Hypertext Transfer Protocol Secure","Hypertext Transfer Protocol","Telnet","Trivial File Transfer Protocol"],a:0,e:"Hypertext Transfer Protocol Secure uses encryption to protect web traffic."},

{q:"Which file transfer protocol is more secure than plain File Transfer Protocol?",opts:["Secure File Transfer Protocol","Telnet","Simple Network Management Protocol version 1","Post Office Protocol version 3 without encryption"],a:0,e:"Secure File Transfer Protocol protects file transfer using Secure Shell encryption."},

{q:"Why should insecure protocols like Telnet be avoided?",opts:["They can transmit sensitive data in plaintext","They always use strong encryption","They require multifactor authentication by default","They block all attackers"],a:0,e:"Telnet sends data without encryption, which can expose credentials and commands."},

{q:"Which port is commonly associated with Hypertext Transfer Protocol Secure?",opts:["443","80","23","21"],a:0,e:"Port 443 is commonly used for Hypertext Transfer Protocol Secure."},

{q:"Which port is commonly associated with Secure Shell?",opts:["22","23","25","53"],a:0,e:"Port 22 is commonly used for Secure Shell."},

{q:"Which port is commonly associated with Domain Name System?",opts:["53","443","22","3389"],a:0,e:"Port 53 is commonly used for Domain Name System queries."},

{q:"Which protocol should replace Telnet for secure management?",opts:["Secure Shell","File Transfer Protocol","Simple Mail Transfer Protocol","Domain Name System"],a:0,e:"Secure Shell provides encrypted remote management and is preferred over Telnet."},

{q:"Which protocol should replace plain Hypertext Transfer Protocol for sensitive websites?",opts:["Hypertext Transfer Protocol Secure","Telnet","Trivial File Transfer Protocol","File Transfer Protocol"],a:0,e:"Hypertext Transfer Protocol Secure encrypts web traffic and protects data in transit."},

{q:"A company wants to block users from visiting known phishing websites. Which capability is most relevant?",opts:["Web and Domain Name System filtering","Static code analysis","Bluetooth pairing","Secure baseline imaging"],a:0,e:"Web and Domain Name System filtering can block known malicious websites and domains."},

{q:"A company wants to prove that an application update came from the real developer and was not changed. What should it use?",opts:["Code signing","Wireless heat map","Spam filtering","Domain Name System sinkhole only"],a:0,e:"Code signing validates software publisher identity and integrity."},

{q:"A company wants to detect if a critical system file changes unexpectedly. Which tool helps most?",opts:["File integrity monitoring","Sender Policy Framework","Site survey","Secure File Transfer Protocol"],a:0,e:"File integrity monitoring detects unauthorized changes to important files."},

{q:"A company wants to stop non-compliant laptops from joining the internal network. Which control fits best?",opts:["Network Access Control","DomainKeys Identified Mail","Hypertext Transfer Protocol Secure","Wireless heat map"],a:0,e:"Network Access Control can check device compliance before granting network access."},

{q:"A company wants to detect unusual employee behavior after an account compromise. Which tool fits best?",opts:["User Behavior Analytics","Wired Equivalent Privacy","Simple Mail Transfer Protocol","Static code analysis"],a:0,e:"User Behavior Analytics can detect abnormal activity from legitimate accounts."},

{q:"A company wants endpoint visibility into processes, registry changes, and suspicious behavior. Which tool fits best?",opts:["Endpoint Detection and Response","Domain Name System filtering only","Sender Policy Framework","Wireless site survey"],a:0,e:"Endpoint Detection and Response monitors endpoint behavior and supports investigation and response."},

{q:"Which statement best compares Endpoint Detection and Response and User Behavior Analytics?",opts:["Endpoint Detection and Response focuses on endpoint activity; User Behavior Analytics focuses on abnormal user behavior","They are exactly the same","User Behavior Analytics only blocks websites","Endpoint Detection and Response only signs email"],a:0,e:"Endpoint Detection and Response monitors devices, while User Behavior Analytics focuses on behavior patterns of users and accounts."},

{q:"Which statement best compares web filtering and Domain Name System filtering?",opts:["Web filtering controls web access; Domain Name System filtering blocks or allows domain resolution","They are unrelated to internet access","Domain Name System filtering only scans source code","Web filtering only signs email"],a:0,e:"Both can block unsafe destinations, but Domain Name System filtering works during name resolution while web filtering works at web access/policy level."},


{q:"What is vulnerability management?",opts:["A one-time scan performed after a breach","A systematic process for identifying, evaluating, prioritizing, and mitigating vulnerabilities","A tool used only to block spam emails","A process for deleting old logs"],a:1,e:"Vulnerability management is the ongoing process of finding, evaluating, prioritizing, and fixing or reducing vulnerabilities."},

{q:"Which objective covers vulnerability management activities?",opts:["Objective 4.3","Objective 2.1","Objective 5.5","Objective 1.2"],a:0,e:"Objective 4.3 focuses on activities associated with vulnerability management."},

{q:"Which objective covers alerting and monitoring?",opts:["Objective 4.4","Objective 3.1","Objective 5.1","Objective 2.5"],a:0,e:"Objective 4.4 focuses on security alerting and monitoring concepts and tools."},

{q:"What is the main goal of vulnerability management?",opts:["To remove every possible business risk forever","To minimize security breaches and manage risk effectively","To create more user accounts","To replace all firewalls"],a:1,e:"The goal is to maintain a secure posture by reducing exploitable weaknesses and managing risk."},

{q:"What is the first major step in vulnerability management?",opts:["Ignoring scan results","Identifying vulnerabilities","Publishing findings publicly","Deleting all vulnerable systems"],a:1,e:"Identifying vulnerabilities is the starting point because you cannot fix what you do not know exists."},

{q:"What is vulnerability identification?",opts:["Recognizing and categorizing weaknesses in systems, applications, or networks","Encrypting all files","Approving user access","Destroying old equipment"],a:0,e:"Vulnerability identification finds and categorizes weaknesses that attackers could exploit."},

{q:"Which method automatically probes systems to find known weaknesses?",opts:["Vulnerability scanning","Email filtering","Domain registration","Password vaulting"],a:0,e:"Vulnerability scanning uses automated tools to check systems against known vulnerability databases or checks."},

{q:"Which tools are commonly associated with vulnerability scanning?",opts:["Nessus and OpenVAS","Microsoft Word and Excel","Simple Mail Transfer Protocol and Domain Name System","Bluetooth and Near Field Communication"],a:0,e:"Nessus and OpenVAS are common vulnerability scanning tools."},

{q:"What is application security testing used for in vulnerability identification?",opts:["Finding weaknesses in software during its life cycle","Replacing network segmentation","Destroying infected hardware","Creating wireless heat maps"],a:0,e:"Application security testing looks for software weaknesses using methods such as static analysis, dynamic analysis, and package monitoring."},

{q:"What is static analysis?",opts:["Testing an application while it is running","Examining source code without executing it","Scanning wireless channels","Monitoring Domain Name System traffic only"],a:1,e:"Static analysis reviews code without running the program."},

{q:"What is dynamic analysis?",opts:["Evaluating an application while it is running","Reviewing code only on paper","Deleting vulnerable packages","Encrypting backups"],a:0,e:"Dynamic analysis tests the application during execution to observe runtime behavior."},

{q:"What is package monitoring?",opts:["Tracking third-party libraries and dependencies for vulnerabilities and updates","Monitoring physical mail packages","Watching user login times only","Blocking all external websites"],a:0,e:"Package monitoring checks software dependencies because vulnerable libraries can affect the application."},

{q:"What does penetration testing add beyond basic vulnerability scanning?",opts:["It simulates real attacks to validate exploitability","It only prints inventory reports","It replaces all patching","It prevents every vulnerability"],a:0,e:"Penetration testing attempts to confirm whether weaknesses can actually be exploited."},

{q:"Why are system and process audits useful in vulnerability management?",opts:["They review systems, policies, and procedures against standards and best practices","They exploit systems without permission","They replace monitoring tools","They remove the need for documentation"],a:0,e:"Audits help verify whether systems and processes follow security expectations."},

{q:"What is the purpose of the planning phase in vulnerability management?",opts:["To define policies, procedures, testing methods, and remediation processes","To immediately publish all vulnerabilities","To disable all security controls","To skip approval"],a:0,e:"Planning establishes how vulnerabilities will be tracked, tested, and fixed."},

{q:"Why should patches be tested before enterprise-wide deployment?",opts:["To ensure they do not break systems or cause unexpected issues","To make patching slower for no reason","To avoid fixing vulnerabilities","To hide scan results"],a:0,e:"Testing patches in a controlled environment reduces the chance of outages or compatibility problems."},

{q:"What is a threat intelligence feed?",opts:["A source of information about emerging threats, indicators, vulnerabilities, and attacker behavior","A password reset form","A physical security camera","A backup schedule"],a:0,e:"Threat intelligence feeds provide current information that helps organizations identify and respond to risks proactively."},

{q:"How do threat intelligence feeds support vulnerability management?",opts:["They help identify emerging threats and prioritize mitigation","They remove the need for patching","They guarantee no false positives","They replace all security teams"],a:0,e:"Threat intelligence helps teams understand which vulnerabilities are actively targeted or important."},

{q:"What is responsible disclosure?",opts:["Ethically reporting a vulnerability to the affected organization before public release","Posting exploit details immediately online","Ignoring a discovered vulnerability","Selling vulnerabilities to attackers"],a:0,e:"Responsible disclosure gives the affected organization time to validate and fix the issue before public details are shared."},

{q:"What is a bug bounty program?",opts:["A program that rewards researchers for valid vulnerability reports","A tool for blocking email spam","A password cracking method","A backup verification method"],a:0,e:"Bug bounty programs incentivize researchers to report vulnerabilities responsibly."},

{q:"Which platform is commonly associated with bug bounty programs?",opts:["HackerOne","Simple Mail Transfer Protocol","Secure Shell","Domain Name System Security Extensions"],a:0,e:"Platforms like HackerOne, Bugcrowd, and Synack are commonly used for bug bounty programs."},

{q:"What should a responsible disclosure program clearly define?",opts:["Scope, reporting channels, legal protections, rewards, and timelines","Only the company logo","Only employee vacation days","Only wireless channel numbers"],a:0,e:"Clear rules help researchers know what is allowed, how to report, and what timeline to expect."},

{q:"Why is confidentiality important in vulnerability reporting?",opts:["Reports can act like maps for attackers if exposed","It makes vulnerabilities disappear","It removes legal obligations","It prevents all false positives"],a:0,e:"Vulnerability details can help attackers, so reports should be protected and shared on a need-to-know basis."},

{q:"What is vulnerability confirmation?",opts:["Determining whether a reported weakness is real and accurate","Automatically deleting all scan findings","Publishing all findings publicly","Ignoring low-risk issues"],a:0,e:"Vulnerability confirmation checks whether a potential weakness is valid."},

{q:"What is a true positive?",opts:["A real vulnerability correctly identified","A vulnerability that exists but was missed","A reported vulnerability that is not real","A safe system incorrectly marked as safe"],a:0,e:"A true positive is a valid finding where the vulnerability really exists."},

{q:"What is a false positive?",opts:["A vulnerability that exists but was missed","A reported vulnerability that is not actually present","A correctly secure system","A confirmed exploited vulnerability"],a:1,e:"A false positive is an incorrect finding that reports a vulnerability where none exists."},

{q:"What is a false negative?",opts:["A vulnerability exists but the tool or process misses it","A real vulnerability is correctly found","A non-vulnerable system is correctly ignored","A duplicate report is removed"],a:0,e:"A false negative is dangerous because a real vulnerability remains undetected."},

{q:"What is a true negative?",opts:["Correctly identifying that no vulnerability is present","Incorrectly reporting a vulnerability","Missing a real vulnerability","Confirming a known exploit"],a:0,e:"A true negative means the system correctly identifies the absence of a vulnerability."},

{q:"Which finding is usually most dangerous?",opts:["False negative","True positive","True negative","Documented exception"],a:0,e:"A false negative is serious because the organization may believe it is safe while a real vulnerability remains."},

{q:"What does vulnerability prioritization involve?",opts:["Ranking vulnerabilities by severity, exploitability, impact, and asset importance","Fixing issues randomly","Ignoring business impact","Deleting scan reports"],a:0,e:"Prioritization helps teams focus first on the vulnerabilities that matter most."},

{q:"Which scoring system is commonly used to rate vulnerability severity?",opts:["Common Vulnerability Scoring System (CVSS)","Domain Name System Security Extensions","Simple Network Management Protocol","Hypertext Transfer Protocol Secure"],a:0,e:"Common Vulnerability Scoring System provides standardized severity scores for vulnerabilities."},

{q:"What is Common Vulnerabilities and Exposures (CVE)?",opts:["A standardized identifier system for known vulnerabilities","A password manager","A wireless encryption protocol","A log collection tool"],a:0,e:"Common Vulnerabilities and Exposures gives known vulnerabilities unique identifiers."},

{q:"Why is Common Vulnerabilities and Exposures useful?",opts:["It standardizes vulnerability references across tools and reports","It automatically patches every system","It replaces all risk analysis","It hides vulnerabilities from vendors"],a:0,e:"Common identifiers make it easier to track, discuss, and prioritize known vulnerabilities."},

{q:"What does exposure factor estimate?",opts:["The percentage of asset damage expected from exploitation","The number of passwords in a vault","The size of a network packet","The age of a server"],a:0,e:"Exposure factor estimates how much damage an asset may suffer if a vulnerability is exploited."},

{q:"What is risk tolerance?",opts:["The level of risk an organization is willing to accept","A vulnerability scanning tool","A mandatory patch deadline","A type of malware"],a:0,e:"Risk tolerance affects how quickly and aggressively an organization remediates vulnerabilities."},

{q:"How does low risk tolerance affect remediation?",opts:["Even minor vulnerabilities may need quick remediation","All vulnerabilities are ignored","Only cosmetic issues are fixed","No monitoring is needed"],a:0,e:"Low risk tolerance means the organization accepts less risk, so remediation may be faster."},

{q:"How does high risk tolerance affect remediation?",opts:["Some lower-risk vulnerabilities may be monitored instead of fixed immediately","Every finding must be fixed instantly","Scanning is not needed","Reports are always public"],a:0,e:"Higher risk tolerance may allow the organization to accept or monitor some vulnerabilities temporarily."},

{q:"What is vulnerability remediation?",opts:["Taking action to reduce or remove a vulnerability","Only identifying a weakness","Only writing a report","Only assigning a score"],a:0,e:"Remediation includes actions such as patching, reconfiguration, segmentation, or compensating controls."},

{q:"Which action is an example of remediation?",opts:["Installing a vendor patch","Ignoring a critical finding","Publishing an exploit","Removing all monitoring"],a:0,e:"Installing a patch is a common remediation action."},

{q:"What is patching?",opts:["Applying updates that fix software, system, or application vulnerabilities","Creating a new user account","Changing a wireless channel","Disabling all access logs"],a:0,e:"Patching applies vendor updates that fix known weaknesses."},

{q:"What is network segmentation used for in remediation?",opts:["To isolate systems and prevent threat propagation","To put all systems on one flat network","To remove all access controls","To disable monitoring"],a:0,e:"Segmentation limits lateral movement and reduces the impact of a compromise."},

{q:"What is a compensating control?",opts:["An alternative security measure used when the primary control is not feasible","A control that deletes evidence","A control that removes all risk","A tool used only for spam filtering"],a:0,e:"Compensating controls provide alternative protection when the ideal control cannot be implemented."},

{q:"What is an exception in vulnerability management?",opts:["A temporary relaxation or bypass of a security control for a business reason","A permanent retirement of a server","A confirmed false positive","A mandatory patch"],a:0,e:"An exception is usually temporary and should be documented with accepted risk."},

{q:"What is an exemption in vulnerability management?",opts:["A permanent waiver of a security control, often for a specific reason like a legacy system","A temporary scan result","A failed login event","A vulnerability database entry"],a:0,e:"An exemption is a longer-term or permanent waiver from a control requirement."},

{q:"What is the difference between an exception and an exemption?",opts:["An exception is temporary; an exemption is permanent or long-term","They are exactly the same","An exemption is always a patch","An exception is always a scan"],a:0,e:"Exceptions are temporary waivers, while exemptions are usually permanent or long-term waivers."},

{q:"Why should exceptions and exemptions be documented?",opts:["To show business justification, accepted risk, and review requirements","To hide them from auditors","To avoid accountability","To delete evidence"],a:0,e:"Documentation ensures the organization understands and accepts the risk."},

{q:"What is remediation validation?",opts:["Checking that the fix actually worked","Guessing that a patch worked","Deleting the original scan","Publishing the vulnerability publicly"],a:0,e:"Validation confirms that remediation reduced or removed the vulnerability."},

{q:"What is rescanning used for after remediation?",opts:["To confirm the vulnerability was fixed and detect remaining issues","To create more vulnerabilities","To avoid verification","To delete reports"],a:0,e:"Rescanning checks whether the same vulnerability still appears after remediation."},

{q:"Why should post-remediation scans replicate initial scan conditions?",opts:["To compare results fairly and consistently","To guarantee false positives","To make scans fail","To avoid finding new issues"],a:0,e:"Using similar conditions makes it easier to confirm whether the specific issue was fixed."},

{q:"What is configuration auditing?",opts:["Checking systems for misconfigurations or deviations from standards","Changing passwords randomly","Blocking emails","Destroying old drives"],a:0,e:"Configuration auditing checks whether systems follow approved settings."},

{q:"What is patch auditing?",opts:["Confirming that patches were properly applied and effective","Approving new vendors","Scanning wireless signal strength","Deleting outdated tickets"],a:0,e:"Patch auditing verifies patch status and effectiveness."},

{q:"What is verification in remediation validation?",opts:["Final testing to confirm patches and configuration changes fixed the issue","Opening all firewall ports","Skipping user testing","Marking all findings as false positives"],a:0,e:"Verification confirms both vulnerability resolution and system stability."},

{q:"Why can user verification matter after remediation?",opts:["Users can confirm applications and services still work correctly","Users replace scanners","Users approve all vulnerabilities","Users delete all reports"],a:0,e:"Fixes should not break business functionality, so user feedback can confirm normal operation."},

{q:"What is vulnerability reporting?",opts:["Documenting and communicating security weaknesses and remediation progress","Only scanning ports","Only exploiting a target","Only writing marketing summaries"],a:0,e:"Vulnerability reporting communicates findings clearly so responsible teams can act."},

{q:"What should vulnerability reports be?",opts:["Clear, concise, transparent, and protected","Public immediately with all exploit details","Hidden from remediation teams","Written with no evidence"],a:0,e:"Good reports are clear and useful while protecting sensitive details."},

{q:"What is internal vulnerability reporting?",opts:["Communicating findings within the organization","Publishing findings to everyone online","Selling vulnerability details","Reporting only to customers"],a:0,e:"Internal reporting keeps findings inside the organization for remediation and tracking."},

{q:"What is external vulnerability reporting?",opts:["Communicating vulnerability information to vendors, partners, customers, or public channels when appropriate","Deleting all scan reports","Only reporting to the help desk","Ignoring third-party software"],a:0,e:"External reporting may involve vendors, affected parties, or public vulnerability databases."},

{q:"Which detail should be shared carefully in external reporting?",opts:["Sensitive technical exploit details","The company logo","Generic training reminders","A public product name only"],a:0,e:"Sensitive details should be limited to prevent attackers from using the report."},

{q:"What is monitoring in security operations?",opts:["Collecting and observing security-relevant data to detect problems","Installing random software","Deleting alerts","Performing only annual reviews"],a:0,e:"Monitoring watches systems, networks, and applications for suspicious or abnormal activity."},

{q:"What is alerting?",opts:["Notifying teams when monitored activity meets defined conditions","Encrypting disks","Creating user accounts","Destroying hardware"],a:0,e:"Alerting turns important monitored events into notifications for investigation."},

{q:"What is a monitoring resource?",opts:["A data source or tool used to observe security and operational activity","A password reset page","A static policy document only","A physical badge"],a:0,e:"Monitoring resources include logs, sensors, agents, network tools, and security platforms."},

{q:"Why is monitoring important?",opts:["It helps detect threats, failures, anomalies, and indicators of compromise","It guarantees no breach","It removes the need for response","It replaces all security controls"],a:0,e:"Monitoring gives visibility so teams can detect and respond to issues."},

{q:"What is Simple Network Management Protocol used for?",opts:["Monitoring and managing network devices","Encrypting web traffic","Sending email","Performing code signing"],a:0,e:"Simple Network Management Protocol is used to collect status and performance data from network devices."},

{q:"What type of devices commonly use Simple Network Management Protocol?",opts:["Routers, switches, printers, and servers","Only smartphones","Only paper records","Only door locks"],a:0,e:"Simple Network Management Protocol is common for monitoring network infrastructure and managed devices."},

{q:"What is a Simple Network Management Protocol trap?",opts:["A message sent by a device to report an event or condition","A phishing email","A wireless password","A vulnerability score"],a:0,e:"A trap is an alert-like message sent from a managed device to a monitoring system."},

{q:"Why should older Simple Network Management Protocol versions be avoided when possible?",opts:["They may use weak security or cleartext community strings","They always encrypt everything strongly","They prevent monitoring","They cannot be configured"],a:0,e:"Older versions can expose management information if not protected properly."},

{q:"Which version of Simple Network Management Protocol is generally preferred for security?",opts:["Simple Network Management Protocol version 3","Simple Network Management Protocol version 1","Simple Network Management Protocol version 2 without protection","No monitoring protocol"],a:0,e:"Simple Network Management Protocol version 3 supports stronger authentication and encryption."},

{q:"What is Security Information and Event Management?",opts:["A platform that collects, correlates, analyzes, and alerts on security events","A wireless encryption method","A file transfer protocol","A password attack"],a:0,e:"Security Information and Event Management centralizes logs and correlates events to detect suspicious activity."},

{q:"Why is Security Information and Event Management useful?",opts:["It correlates events across many sources","It replaces all endpoint tools","It removes the need for logs","It prevents every false positive"],a:0,e:"Correlation across systems helps reveal patterns that single devices may not show alone."},

{q:"Which data commonly feeds into Security Information and Event Management?",opts:["Firewall logs, endpoint alerts, authentication logs, and server logs","Only lunch orders","Only keyboard layouts","Only marketing emails"],a:0,e:"Security Information and Event Management collects events from many systems and security tools."},

{q:"What is correlation in Security Information and Event Management?",opts:["Linking related events from different sources to identify patterns","Deleting repeated logs","Changing passwords","Encrypting emails"],a:0,e:"Correlation connects events to identify suspicious sequences or broader incidents."},

{q:"What is data normalization in Security Information and Event Management?",opts:["Converting logs from different formats into a common structure","Deleting all unusual events","Making all passwords the same","Turning off alerts"],a:0,e:"Normalization helps compare and search logs from different sources consistently."},

{q:"What is Security Content Automation Protocol?",opts:["A standardized way to automate vulnerability and configuration checking","A wireless authentication method","A spam filter rule","A password vault"],a:0,e:"Security Content Automation Protocol standardizes security configuration and vulnerability data for automated assessment."},

{q:"Which benchmark might be used with Security Content Automation Protocol?",opts:["Center for Internet Security Microsoft Windows 10 Enterprise Benchmark","A personal playlist","A wireless heat map only","A calendar invite"],a:0,e:"Security Content Automation Protocol can use benchmarks such as Center for Internet Security configuration benchmarks."},

const STORAGE_KEY = "secplus_quiz_state_v1";

// safe init (avoids crash if questions not defined)
let order = (typeof questions !== "undefined")
  ? [...Array(questions.length).keys()]
  : [];

let idx = 0;
let locked = false;
let stats = {c:0,w:0};

function saveState(){
  try{
    const state = { order, idx, stats };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){}
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(!s || !Array.isArray(s.order)) return false;

    // basic validation
    order = s.order;
    idx = Number.isInteger(s.idx) ? s.idx : 0;
    stats = s.stats && typeof s.stats === "object" ? s.stats : {c:0,w:0};

    if(idx < 0) idx = 0;
    if(idx >= order.length) idx = 0;

    return true;
  }catch(e){
    return false;
  }
}

window.addEventListener("beforeunload", saveState);

const posEl = document.getElementById("pos");
const scoreEl = document.getElementById("score");
const qTextEl = document.getElementById("qText");
const optsEl = document.getElementById("opts");
const expEl = document.getElementById("exp");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const resetBtn = document.getElementById("resetBtn");

function render(){
  if(typeof questions === "undefined" || !questions.length){
    qTextEl.textContent = "Error: questions[] not found. Paste your questions above the script.";
    optsEl.innerHTML = "";
    nextBtn.disabled = true;
    prevBtn.disabled = true;
    return;
  }

  const qObj = questions[order[idx]];
  posEl.textContent = `Q ${idx+1} / ${order.length}`;
  scoreEl.textContent = `Score: ${stats.c} correct, ${stats.w} wrong`;
  qTextEl.textContent = qObj.q;

  optsEl.innerHTML = "";
  expEl.style.display = "none";
  expEl.innerHTML = "";
  locked = false;
  nextBtn.disabled = true;
  prevBtn.disabled = (idx === 0);

  qObj.opts.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    b.textContent = t;
    b.addEventListener("click", () => choose(i));
    optsEl.appendChild(b);
  });

  saveState();
}

function choose(pick){
  if(locked) return;
  locked = true;

  const qObj = questions[order[idx]];
  const buttons = [...optsEl.querySelectorAll("button.opt")];
  buttons.forEach(b => b.disabled = true);

  const correct = qObj.a;

  if(pick === correct){
    stats.c++;
    buttons[pick].classList.add("good");
    expEl.style.display = "block";
    expEl.innerHTML = `<b>Correct.</b> ${qObj.e}`;
  } else {
    stats.w++;
    buttons[pick].classList.add("bad");
    buttons[correct].classList.add("good");
    expEl.style.display = "block";
    expEl.innerHTML = `<b>Wrong.</b> Correct answer: <b>${qObj.opts[correct]}</b><br><span class="small">${qObj.e}</span>`;
  }

  scoreEl.textContent = `Score: ${stats.c} correct, ${stats.w} wrong`;
  nextBtn.disabled = false;
  saveState();
}

nextBtn.addEventListener("click", () => {
  if(idx < order.length - 1){
    idx++;
    render();
  }
  saveState();
});

prevBtn.addEventListener("click", () => {
  if(idx > 0){
    idx--;
    render();
  }
  saveState();
});

shuffleBtn.addEventListener("click", () => {
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0;
  saveState();
  render();
});

resetBtn.addEventListener("click", () => {
  const ok = confirm("Reset score and go back to Question 1?");
  if(!ok) return;
  stats = {c:0,w:0};
  idx = 0;
  saveState();
  render();
});

// restore state if exists
loadState();
render();
</script>
